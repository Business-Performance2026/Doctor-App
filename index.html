<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<style>

    --bg:#F3F6F5;
    --surface:#FFFFFF;
    --primary:#0F3336;
    --primary-light:#1F5F63;
    --primary-dark:#0A2426;
    --accent:#C97B3D;
    --accent-light:#E8A263;
    --after:#4C8C7A;
    --text:#16262A;
    --muted:#6B8079;
    --border:#E1E8E5;
    --danger:#B3462C;
    --shadow-sm: 0 1px 2px rgba(15,51,54,.06);
    --shadow-md: 0 4px 16px rgba(15,51,54,.08);
    --shadow-lg: 0 12px 32px rgba(15,51,54,.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Cairo', sans-serif; letter-spacing:-.01em; }
  button{ font-family:'Tajawal', sans-serif; cursor:pointer; }
  input, select, textarea{ font-family:'Tajawal', sans-serif; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--primary-light) !important; box-shadow:0 0 0 3px rgba(31,95,99,.12); }

  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:230px; background:linear-gradient(175deg, var(--primary), var(--primary-dark)); color:#fff;
    padding:26px 18px; flex-shrink:0;
    display:flex; flex-direction:column; gap:28px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:36px; height:36px; border-radius:10px; background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo'; font-weight:800; color:#fff; font-size:17px;
    box-shadow:0 3px 10px rgba(201,123,61,.4);
  }
  .brand-name{ font-family:'Cairo'; font-weight:800; font-size:20px; letter-spacing:-.02em; }
  .nav-item{
    padding:11px 13px; border-radius:9px; color:#B9D2CC; font-weight:600;
    display:flex; align-items:center; gap:10px; font-size:14.5px;

  .nav-item.active{ background:rgba(255,255,255,.13); color:#fff; }
  .doctor-card{
    margin-top:auto; padding:14px; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px; font-size:13px; line-height:1.6;

  .doctor-card b{ display:block; font-family:'Cairo'; font-size:14.5px; color:#fff; }
  .logout-btn{

  .logout-btn:hover{ background:rgba(255,255,255,.08); color:#fff; }

  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }

  .btn:hover{ background:var(--primary-light); transform:translateY(-1px); box-shadow:var(--shadow-md); }

  .btn.secondary:hover{ border-color:var(--primary-light); background:var(--bg); transform:none; }
  .btn.accent{ background:var(--accent); }

  .patient-avatar{

  .timeline-card{

  .timeline-date{ font-size:12px; color:var(--muted); font-weight:700; margin-bottom:8px; }
  .timeline-type{

  .timeline-proc{ font-size:12px; color:var(--accent); font-weight:700; margin-top:4px; }

  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:16px; }
  .photo-card{
    background:var(--surface); border:1.5px solid var(--border); border-radius:16px;
    overflow:hidden; cursor:pointer; transition:.18s; box-shadow:var(--shadow-sm);

  .photo-card img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--bg); }
  .photo-card-body{ padding:11px 13px; }
  .photo-card-date{ font-size:11px; color:var(--muted); margin-top:7px; font-weight:500; }
  .photo-card-proc{ font-size:11.5px; color:var(--accent); font-weight:700; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:60; display:flex;

  .lightbox-close{

    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:14px 18px; }
    .doctor-card{ display:none; }
    .nav-item span.label{ display:none; }

  .avatar-upload-box img{ width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--border); }
  .avatar-placeholder{ width:52px; height:52px; border-radius:50%; background:var(--bg); border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--muted); flex-shrink:0; }
  .auth-toggle{ display:flex; gap:8px; margin-bottom:18px; background:var(--bg); border-radius:10px; padding:4px; }

  .ocr-note{ font-size:11.5px; color:var(--muted); background:var(--bg); padding:9px 11px; border-radius:8px; margin-top:8px; line-height:1.6; }

<script type="module">

  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,

/* ---------- state ---------- */
let state = {
  view: 'login',
  doctor: null,
  user: null,
  patients: [],
  activePatientId: null,
  activePatient: null,
  photos: [],
  photoFilter: 'all',
  lightboxUrl: null,
  toast: null,
  authMode: 'signin', // signin | signup
};

function setState(patch){ Object.assign(state, patch); render(); }

/* ---------- helpers ---------- */
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' }) +
         ' — ' + d.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
}

function showToast(msg){
  setState({ toast: msg });
  setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          if (width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataURLtoBlob(dataUrl){
  const [header, b64] = dataUrl.split(',');
  const mime = header.match(/data:(.*?);base64/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function uploadImageDataUrl(dataUrl, path){
  const blob = dataURLtoBlob(dataUrl);
  const storageRef = ref(fbStorage, path);
  await uploadBytes(storageRef, blob);
  return await getDownloadURL(storageRef);
}

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- Firestore data layer (scoped per doctor via doctorUid field + security rules) ---------- */
async function loadDoctorProfile(u){
  const snap = await getDoc(doc(db, 'doctors', u.uid));
  return snap.exists() ? snap.data() : null;
}
async function saveDoctorProfile(u, profile){
  await setDoc(doc(db, 'doctors', u.uid), profile, { merge: true });
}

async function loadPatients(u){
  const q = query(collection(db, 'patients'), where('doctorUid','==', u.uid));
  const snap = await getDocs(q);
  const list = [];
  snap.forEach(d => list.push({ id: d.id, ...d.data() }));
  list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  return list;
}

async function createPatient(u, patientData){
  const ref_ = await addDoc(collection(db, 'patients'), { ...patientData, doctorUid: u.uid, createdAt: new Date().toISOString() });
  return ref_.id;
}

async function loadPhotos(u, patientId){
  const q = query(collection(db, 'photos'), where('doctorUid','==', u.uid), where('patientId','==', patientId));
  const snap = await getDocs(q);
  const list = [];
  snap.forEach(d => list.push({ id: d.id, ...d.data() }));
  list.sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
  return list;
}

async function createPhoto(u, patientId, photoData){
  await addDoc(collection(db, 'photos'), { ...photoData, doctorUid: u.uid, patientId, timestamp: new Date().toISOString() });
}

/* ---------- OCR (Tesseract.js, runs fully in-browser, no external AI needed) ---------- */
/* ---------- face detection (face-api.js, runs fully in-browser) — used to auto-crop the personal photo from the ID card ---------- */
let faceApiReady = false;
(async function loadFaceModels(){
  try{
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    faceApiReady = true;
  }catch(e){ console.error('face model load failed', e); }
})();

async function detectAndCropFace(dataUrl, targetSize){
  if (!faceApiReady) throw new Error('كاشف الوجه لسا يجهّز، حاول بعد ثوانٍ');
  const img = await new Promise((resolve, reject)=>{
    const im = new Image();
    im.onload = ()=> resolve(im);
    im.onerror = ()=> reject(new Error('تعذّر تحميل الصورة'));
    im.src = dataUrl;
  });
  const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions());
  if (!detection) throw new Error('لم يتم العثور على وجه واضح بالصورة');
  const box = detection.box;
  const padX = box.width * 0.7;
  const padY = box.height * 1.0;
  const sx = Math.max(0, box.x - padX/2);
  const sy = Math.max(0, box.y - padY*0.65);
  const sw = Math.min(img.width - sx, box.width + padX);
  const sh = Math.min(img.height - sy, box.height + padY);
  const size = targetSize || 240;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const srcSize = Math.min(sw, sh);
  const cropX = sx + (sw - srcSize)/2;
  const cropY = sy + (sh - srcSize)/2;
  ctx.drawImage(img, cropX, cropY, srcSize, srcSize, 0, 0, size, size);
  return canvas.toDataURL('image/jpeg', 0.85);
}

async function runOcr(dataUrl, onProgress){
  const { data } = await Tesseract.recognize(dataUrl, 'ara+eng', {
    logger: m => { if (onProgress && m.status === 'recognizing text') onProgress(Math.round(m.progress*100)); }
  });
  return data.text || '';
}

function guessName(lines){
  const NAME_KEYWORDS = [/الا?إ?أ?سم/, /^Name/i, /الاسم/, /الإسم/, /الأسم/];
  const ARABIC_CHARS = /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/g;
  function arabicRatio(str){
    const noSpace = str.replace(/\s/g,'');
    if (!noSpace.length) return 0;
    const arabicCount = (noSpace.match(ARABIC_CHARS) || []).length;
    return arabicCount / noSpace.length;
  }
  function cleanLine(str){
    // نشيل الرموز الشائعة اللي تدخل غلط بالقراءة، بنخلي الحروف والمسافات بس
    return str.replace(/[^\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFFa-zA-Z\s]/g, ' ').replace(/\s+/g,' ').trim();
  }

  for (let i=0; i<lines.length; i++){
    if (NAME_KEYWORDS.some(r => r.test(lines[i]))){
      const sameLine = cleanLine(lines[i].replace(/(الا?إ?أ?سم|Name)\s*[:\-]?\s*/i, ''));
      if (sameLine && arabicRatio(sameLine) > 0.6 && sameLine.split(' ').length >= 2) return sameLine;
      if (lines[i+1]){
        const next = cleanLine(lines[i+1]);
        if (next && arabicRatio(next) > 0.6 && next.split(' ').length >= 2) return next;
      }
    }
  }
  // ما لقينا كلمة "الاسم" — نجرب أفضل سطر أغلبه عربي (نسبة 75%+) وكلمتين لخمسة، بعد تنظيفه من الرموز
  let best = '';
  lines.forEach(line=>{
    const cleaned = cleanLine(line);
    const wordCount = cleaned.split(' ').filter(Boolean).length;
    if (wordCount >= 2 && wordCount <= 5 && cleaned.length >= 6 && cleaned.length < 45 && arabicRatio(cleaned) > 0.75){
      if (cleaned.length > best.length) best = cleaned;
    }
  });
  return best;
}

function extractFieldsFromText(text){
  const fields = { national_id:'', mrn:'', dob:'', phone:'', full_name:'' };
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  fields.full_name = guessName(lines);

  const DATE_RE = /\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}/;
  const NUM_RE = /\d[\d\s\-]{6,}\d/;

  // كل تاريخ ملقى بالنص، مع رقم السطر اللي فيه، عشان نميّز لاحقاً
  const allDates = [];
  lines.forEach((line, i) => {
    const m = line.match(DATE_RE);
    if (m) allDates.push({ raw: m[0].replace(/\//g,'-'), line: i, text: line });
  });

  // كلمات مفتاحية عربي/إنجليزي لكل حقل — تدور بنفس السطر أو السطر اللي بعده
  const KEYWORDS = {
    dob:     [/الميلاد/, /تاريخ\s*الميلاد/, /D\.?O\.?B/i, /Birth/i],
    expiry:  [/الانتهاء/, /الصلاحية/, /انتهاء/, /Expiry/i, /Exp\b/i],
    mrn:     [/رقم\s*الملف/, /الملف\s*الطبي/, /MRN/i, /Medical\s*Record/i, /السجل\s*الطبي/],
    national:[/رقم\s*الهوية/, /الهوية/, /الرقم\s*الوطني/, /National/i, /I\.?D\.?\s*No/i],
    phone:   [/جوال/, /هاتف/, /Phone/i, /Mobile/i],
  };

  function findNear(regexList, extractRe){
    for (let i=0; i<lines.length; i++){
      if (regexList.some(r => r.test(lines[i]))){
        const sameLine = lines[i].match(extractRe);
        if (sameLine) return sameLine[0];
        if (lines[i+1]){
          const nextLine = lines[i+1].match(extractRe);
          if (nextLine) return nextLine[0];
        }
      }
    }
    return null;
  }

  // 1) نحاول أول شي بالكلمات المفتاحية (أدق طريقة)
  let dobByKeyword = findNear(KEYWORDS.dob, DATE_RE);
  let expiryLine = -1;
  lines.forEach((line, i) => { if (KEYWORDS.expiry.some(r => r.test(line))) expiryLine = i; });

  if (dobByKeyword){
    fields.dob = dobByKeyword.replace(/\//g,'-');
  } else if (allDates.length){
    // 2) ما لقينا كلمة "الميلاد" — نستبعد أي تاريخ بنفس سطر "الانتهاء"، وناخذ أقدم تاريخ (الميلاد دايماً أقدم من الإصدار/الانتهاء)
    const candidates = allDates.filter(d => d.line !== expiryLine);
    const pool = candidates.length ? candidates : allDates;
    pool.sort((a,b)=> new Date(a.raw) - new Date(b.raw));
    fields.dob = pool[0].raw;
  }

  const mrnByKeyword = findNear(KEYWORDS.mrn, NUM_RE);
  const idByKeyword = findNear(KEYWORDS.national, NUM_RE);
  const phoneByKeyword = findNear(KEYWORDS.phone, NUM_RE);

  const numbers = (text.match(/\d[\d\s\-]{6,}\d/g) || []).map(s => s.replace(/[\s\-]/g,''));
  const phoneGuess = numbers.find(n => /^(\+?9665|05|9665)\d{7,8}$/.test(n));

  fields.national_id = (idByKeyword || '').replace(/[\s\-]/g,'') || '';
  fields.mrn = (mrnByKeyword || '').replace(/[\s\-]/g,'') || '';
  fields.phone = (phoneByKeyword || phoneGuess || '').replace(/[\s\-]/g,'') || '';

  // 3) لو ما لقينا بالكلمات المفتاحية، رجوع لطريقة "أول رقمين" كحل أخير
  if (!fields.national_id && !fields.mrn){
    const idCandidates = numbers.filter(n => n.length >= 8 && n.length <= 14 && n !== fields.phone);
    if (idCandidates.length) fields.national_id = idCandidates[0];
    if (idCandidates.length > 1) fields.mrn = idCandidates[1];
  }

  return fields;
}

let scanState = { rawFileUrl:null, previewUrl:null, cropping:false, cropFrac:{x:0.05,y:0.05,w:0.9,h:0.9}, ocrRunning:false, ocrDone:false, errorMsg:null, avatarDataUrl:null, rawText:null, showRawText:false };

/* قص منطقة من صورة عن طريق canvas — مع خيار تحويلها لتدرج رمادي وتحسين التباين لصالح OCR */
function cropRegion(dataUrl, frac, opts){
  opts = opts || {};
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const sx = frac.x * img.width, sy = frac.y * img.height;
      const sw = frac.w * img.width, sh = frac.h * img.height;
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(sw)); canvas.height = Math.max(1, Math.round(sh));
      const ctx = canvas.getContext('2d');
      if (opts.grayscale) ctx.filter = 'grayscale(1) contrast(1.3) brightness(1.05)';
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = ()=> reject(new Error('تعذّر معالجة الصورة'));
    img.src = dataUrl;
  });
}

function wireCropBox(){
  const img = document.getElementById('crop-img');
  const box = document.getElementById('crop-box');
  const handle = document.getElementById('crop-handle');
  if (!img || !box || !handle) return;

  function apply(){
    const rect = img.getBoundingClientRect();
    box.style.left = (scanState.cropFrac.x * rect.width) + 'px';
    box.style.top = (scanState.cropFrac.y * rect.height) + 'px';
    box.style.width = (scanState.cropFrac.w * rect.width) + 'px';
    box.style.height = (scanState.cropFrac.h * rect.height) + 'px';
  }
  if (img.complete) apply(); else img.onload = apply;

  let mode = null, start = null, startFrac = null;
  box.onpointerdown = (e)=>{
    if (e.target === handle) return;
    e.preventDefault();
    mode = 'move'; start = { x:e.clientX, y:e.clientY }; startFrac = { ...scanState.cropFrac };
    box.setPointerCapture(e.pointerId);
  };
  box.onpointermove = (e)=>{
    if (mode !== 'move') return;
    const rect = img.getBoundingClientRect();
    const dx = (e.clientX - start.x) / rect.width, dy = (e.clientY - start.y) / rect.height;
    let x = Math.max(0, Math.min(1 - startFrac.w, startFrac.x + dx));
    let y = Math.max(0, Math.min(1 - startFrac.h, startFrac.y + dy));
    scanState.cropFrac = { ...startFrac, x, y };
    apply();
  };
  box.onpointerup = ()=>{ mode = null; };

  handle.onpointerdown = (e)=>{
    e.preventDefault(); e.stopPropagation();
    mode = 'resize'; start = { x:e.clientX, y:e.clientY }; startFrac = { ...scanState.cropFrac };
    handle.setPointerCapture(e.pointerId);
  };
  handle.onpointermove = (e)=>{
    if (mode !== 'resize') return;
    const rect = img.getBoundingClientRect();
    const dx = (e.clientX - start.x) / rect.width, dy = (e.clientY - start.y) / rect.height;
    let w = Math.max(0.15, Math.min(1 - startFrac.x, startFrac.w + dx));
    let h = Math.max(0.15, Math.min(1 - startFrac.y, startFrac.h + dy));
    scanState.cropFrac = { ...startFrac, w, h };
    apply();
  };
  handle.onpointerup = ()=>{ mode = null; };
}

async function runAnalysisPipeline(){
  document.getElementById('add-overlay').remove();
  scanState.cropping = false; scanState.ocrRunning = true; scanState.ocrDone = false; scanState.errorMsg = null; scanState.progress = 0;
  renderAddPatientModal();
  const frac = scanState.cropFrac;
  try{
    const grayForOcr = await cropRegion(scanState.rawFileUrl, frac, { grayscale:true });
    const colorForFace = await cropRegion(scanState.rawFileUrl, frac, { grayscale:false });
    scanState.previewUrl = colorForFace;

    const text = await runOcr(grayForOcr, (pct)=>{
      scanState.progress = pct;
      const statusEl = document.getElementById('scan-status');
      if (statusEl) statusEl.textContent = 'جاري القراءة... ' + pct + '%';
    });
    const fields = extractFieldsFromText(text);
    scanState.rawText = text;
    scanState.ocrRunning = false; scanState.ocrDone = true;

    try{
      scanState.avatarDataUrl = await detectAndCropFace(colorForFace, 240);
    }catch(faceErr){ console.log('face detection:', faceErr.message); }

    document.getElementById('add-overlay').remove();
    renderAddPatientModal();
    document.getElementById('f-name').value = fields.full_name || '';
    document.getElementById('f-nid').value = fields.national_id || '';
    document.getElementById('f-mrn').value = fields.mrn || '';
    document.getElementById('f-dob').value = fields.dob || '';
    document.getElementById('f-phone').value = fields.phone || '';
  }catch(err){
    scanState.ocrRunning = false; scanState.ocrDone = false;
    scanState.errorMsg = 'تعذّرت القراءة التلقائية: ' + (err && err.message ? err.message : 'خطأ غير معروف') + ' — أدخل البيانات يدوياً';
    console.error('pipeline error', err);
    document.getElementById('add-overlay').remove();
    renderAddPatientModal();
  }
}

    };
    document.getElementById('cancel-crop').onclick = ()=>{
      scanState = { rawFileUrl:null, previewUrl:null, cropping:false, cropFrac:{x:0.05,y:0.05,w:0.9,h:0.9}, ocrRunning:false, ocrDone:false, errorMsg:null, avatarDataUrl:null, rawText:null, showRawText:false };
      document.getElementById('add-overlay').remove();
      renderAddPatientModal();
    };
    return;
  }

  const rawToggleBtn = document.getElementById('toggle-raw-text');
  if (rawToggleBtn) rawToggleBtn.onclick = ()=>{
    scanState.showRawText = !scanState.showRawText;
    document.getElementById('add-overlay').remove();
    renderAddPatientModal();
  };

  document.getElementById('scan-trigger').onclick = ()=> document.getElementById('id-file').click();
  document.getElementById('id-file').onchange = async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    const dataUrl = await resizeImage(file, 1400, 0.85);
    scanState = { ...scanState, rawFileUrl: dataUrl, cropping:true, cropFrac:{x:0.05,y:0.05,w:0.9,h:0.9}, errorMsg:null, rawText:null, showRawText:false, avatarDataUrl:null };
    document.getElementById('add-overlay').remove();
    renderAddPatientModal();
  };

  document.getElementById('avatar-trigger').onclick = ()=> document.getElementById('avatar-file').click();
  document.getElementById('avatar-file').onchange = async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    const dataUrl = await resizeImage(file, 400, 0.85);
    scanState.avatarDataUrl = dataUrl;
    document.getElementById('add-overlay').remove();
    renderAddPatientModal();
  };

  document.getElementById('cancel-add').onclick = ()=>{
    scanState = { rawFileUrl:null, previewUrl:null, cropping:false, cropFrac:{x:0.05,y:0.05,w:0.9,h:0.9}, ocrRunning:false, ocrDone:false, errorMsg:null, avatarDataUrl:null, rawText:null, showRawText:false };
    setState({ showAddModal:false });
  };

  document.getElementById('save-patient').onclick = async ()=>{
    const name = document.getElementById('f-name').value.trim();
    if (!name){ showToast('اسم المريض مطلوب'); return; }
    const saveBtn = document.getElementById('save-patient');
    saveBtn.disabled = true; saveBtn.textContent = 'جاري الحفظ...';
    try{
      const patientData = {
        name,
        nationalId: document.getElementById('f-nid').value.trim(),
        mrn: document.getElementById('f-mrn').value.trim(),
        dob: document.getElementById('f-dob').value.trim(),
        gender: document.getElementById('f-gender').value,
        phone: document.getElementById('f-phone').value.trim(),
        avatarUrl: null,
      };
      const patientId = await createPatient(state.user, patientData);
      if (scanState.avatarDataUrl){
        const url = await uploadImageDataUrl(scanState.avatarDataUrl, `doctors/${state.user.uid}/patients/${patientId}/avatar.jpg`);
        await setDoc(doc(db,'patients',patientId), { avatarUrl: url }, { merge:true });
      }
      const patients = await loadPatients(state.user);
      scanState = { rawFileUrl:null, previewUrl:null, cropping:false, cropFrac:{x:0.05,y:0.05,w:0.9,h:0.9}, ocrRunning:false, ocrDone:false, errorMsg:null, avatarDataUrl:null, rawText:null, showRawText:false };
      setState({ showAddModal:false, patients });
      showToast('تم حفظ المريض بنجاح');
    }catch(err){
      saveBtn.disabled = false; saveBtn.textContent = 'حفظ المريض';
      showToast('تعذّر الحفظ: ' + (err && err.message ? err.message : 'خطأ غير معروف'));
      console.error('save patient error', err);
    }
  };
}

/* ================= PATIENT DETAIL ================= */
function typeLabel(t){
  return t === 'before' ? 'قبل العملية' : t === 'after' ? 'بعد العملية' : 'عرض/أعراض';
}

function renderPatientDetail(){
  const root = document.getElementById('root');
  const p = state.activePatient;
  const filter = state.photoFilter;
  const photos = filter === 'all' ? state.photos : state.photos.filter(ph => ph.type === filter);

  const gridHtml = photos.length ? photos.map(ph => `
    <div class="photo-card" data-url="${ph.imageUrl}">
      <img src="${ph.imageUrl}">
      <div class="photo-card-body">
        <span class="timeline-type ${ph.type}" style="margin-inline-start:0;">${typeLabel(ph.type)}</span>
        <div class="photo-card-date">${fmtDate(ph.timestamp)}</div>
        ${ph.procedure ? `<div class="photo-card-proc">🏷️ ${ph.procedure}</div>` : ''}
      </div>
    </div>
  `).join('') : `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📷</div><div>لا توجد صور بهذا التصنيف بعد</div></div>`;

  root.innerHTML = shell(`
    <button class="back-link" id="back-btn">→ رجوع لقائمة المرضى</button>
    <div class="patient-header">
      <div style="display:flex; gap:16px; align-items:flex-start;">
        ${p.avatarUrl ? `<img src="${p.avatarUrl}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid var(--border); flex-shrink:0;">` : `<div class="patient-avatar" style="width:60px; height:60px; font-size:22px; margin-bottom:0;">${(p.name||'؟').trim()[0] || '؟'}</div>`}
        <div>
          <h1 class="page-title">${p.name}</h1>
          <div class="info-grid">
            <div><span>رقم الهوية</span>${p.nationalId || '—'}</div>
            <div><span>رقم الملف الطبي</span>${p.mrn || '—'}</div>
            <div><span>تاريخ الميلاد</span>${p.dob || '—'}</div>
            <div><span>الجنس</span>${p.gender || '—'}</div>
            <div><span>الجوال</span>${p.phone || '—'}</div>
          </div>
        </div>
      </div>
      <button class="btn accent" id="add-photo-btn">📷 إضافة صورة</button>
    </div>

    <div class="section-head"><h3>الصور الموثّقة</h3></div>
    <div class="filter-chips">
      <div class="chip ${filter==='all'?'active':''}" data-f="all">الكل</div>
      <div class="chip ${filter==='before'?'active':''}" data-f="before">قبل العملية</div>
      <div class="chip ${filter==='after'?'active':''}" data-f="after">بعد العملية</div>
      <div class="chip ${filter==='symptom'?'active':''}" data-f="symptom">أعراض</div>
    </div>
    <div class="photo-grid">${gridHtml}</div>
  `);

  bindShellEvents();
  document.getElementById('back-btn').onclick = ()=> setState({ view:'dashboard' });
  document.getElementById('add-photo-btn').onclick = ()=> setState({ showAddPhotoModal:true });
  document.querySelectorAll('.chip').forEach(c=>{ c.onclick = ()=> setState({ photoFilter: c.dataset.f }); });
  document.querySelectorAll('.photo-card').forEach(card=>{ card.onclick = ()=> setState({ lightboxUrl: card.dataset.url }); });

  if (state.showAddPhotoModal) renderAddPhotoModal();
}

/* ================= ADD PHOTO MODAL ================= */
let photoDraft = { dataUrl:null };

function renderAddPhotoModal(){
  const overlay = el(`
    <div class="overlay" id="photo-overlay">
      <div class="modal">
        <h2>إضافة صورة جديدة</h2>
        <div class="sub">سيُسجَّل تاريخ ووقت الإضافة تلقائياً</div>
        <div class="id-scan-box" id="photo-box">
          ${photoDraft.dataUrl ? `<img src="${photoDraft.dataUrl}">` : `<div style="font-size:30px;">📷</div><div style="font-size:13px; color:var(--muted); margin-top:6px;">التقط أو ارفع صورة</div>`}
          <input type="file" id="photo-file" accept="image/*" capture="environment" style="display:none;">
          <button class="btn secondary" id="photo-trigger" style="margin-top:10px;">اختيار صورة</button>
        </div>
        <div class="field"><label>نوع الصورة *</label>
          <select id="p-type">
            <option value="before">قبل العملية</option>
            <option value="after">بعد العملية</option>
            <option value="symptom">عرض / أعراض</option>
          </select>
        </div>
        <div class="field"><label>اسم الإجراء/العملية (اختياري)</label><input id="p-procedure" placeholder="مثال: شفط دهون - البطن"></div>
        <div class="field"><label>ملاحظة (اختياري)</label><textarea id="p-note" placeholder="أي تفاصيل إضافية..."></textarea></div>
        <div class="modal-actions">
          <button class="btn secondary" id="cancel-photo">إلغاء</button>
          <button class="btn accent" id="save-photo">حفظ الصورة</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('root').appendChild(overlay);

  document.getElementById('photo-trigger').onclick = ()=> document.getElementById('photo-file').click();
  document.getElementById('photo-file').onchange = async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    photoDraft.dataUrl = await resizeImage(file, 1200, 0.78);
    document.getElementById('photo-overlay').remove();
    renderAddPhotoModal();
  };

  document.getElementById('cancel-photo').onclick = ()=>{
    photoDraft = { dataUrl:null };
    setState({ showAddPhotoModal:false });
  };

  document.getElementById('save-photo').onclick = async ()=>{
    if (!photoDraft.dataUrl){ showToast('الرجاء اختيار صورة'); return; }
    const saveBtn = document.getElementById('save-photo');
    saveBtn.disabled = true; saveBtn.textContent = 'جاري الحفظ...';
    try{
      const photoId = uid('ph');
      const imageUrl = await uploadImageDataUrl(photoDraft.dataUrl, `doctors/${state.user.uid}/patients/${state.activePatientId}/photos/${photoId}.jpg`);
      await createPhoto(state.user, state.activePatientId, {
        type: document.getElementById('p-type').value,
        procedure: document.getElementById('p-procedure').value.trim(),
        note: document.getElementById('p-note').value.trim(),
        imageUrl,
      });
      const photos = await loadPhotos(state.user, state.activePatientId);
      photoDraft = { dataUrl:null };
      setState({ showAddPhotoModal:false, photos });
      showToast('تم حفظ الصورة بنجاح');
    }catch(err){
      saveBtn.disabled = false; saveBtn.textContent = 'حفظ الصورة';
      showToast('تعذّر الحفظ: ' + (err && err.message ? err.message : 'خطأ غير معروف'));
      console.error('save photo error', err);
    }
  };
}

/* ================= APP ROUTER ================= */
function renderApp(){
  if (state.view === 'login') renderLogin();
  else if (state.view === 'dashboard') renderDashboard();
  else if (state.view === 'patient') renderPatientDetail();
}

/* ================= INIT ================= */
onAuthStateChanged(auth, async (u)=>{
  if (u && state.view === 'login'){
    try{
      const profile = await loadDoctorProfile(u) || { name: u.email, spec:'' };
      const patients = await loadPatients(u);
      state = { ...state, view:'dashboard', user:u, doctor:profile, patients };
    }catch(e){ console.error(e); }
  }
  render();
});
</script>
